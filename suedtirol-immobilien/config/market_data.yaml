# Renovation costs reference (South Tyrol 2025/2026)
renovation_costs_per_sqm:
  leicht: [400, 700]       # Cosmetic: paint, floors, bathroom surfaces
  mittel: [700, 1200]      # Bath/kitchen new, partial electrics, windows
  schwer: [1200, 2000]     # Complete renovation incl. building services
  luxus: [2000, 3500]      # High-end finish

  # Specific items
  specific:
    badezimmer_neu: [8000, 18000]
    kueche_neu: [5000, 25000]
    neue_trennwaende_pro_sqm: [80, 150]
    neue_tueren_pro_stueck: [800, 2500]
    neue_installationen_je_einheit: [5000, 12000]
    baugenehmigung_teilung: [3000, 8000]
    fenster_pro_stueck: [800, 2000]
    fussboden_pro_sqm: [40, 120]
    malerarbeiten_pro_sqm: [15, 35]
    elektrik_komplett_pro_sqm: [80, 150]
    heizung_neu_pro_sqm: [60, 120]

# Purchase costs (Italy)
purchase_costs:
  grunderwerbsteuer_erstwohnung: 0.02      # 2% on cadastral value
  grunderwerbsteuer_zweitwohnung: 0.09     # 9% on cadastral value
  notar: [2000, 4000]
  makler_pct: 0.03                          # 3% + VAT on purchase price
  makler_mwst: 0.22                         # 22% VAT on broker fee
  kataster_umschreibung: 300
  hypothekensteuer: 50                      # Fixed for prima casa
  katastersteuer: 50                        # Fixed for prima casa

# Selling costs
selling_costs:
  makler_pct: 0.03
  makler_mwst: 0.22
  energieausweis: [200, 400]
  # Capital gains tax: exempt after 5 years of ownership
  # Within 5 years: taxed as income or 26% flat rate (substitute tax)
  plusvalenza_flat_rate: 0.26

